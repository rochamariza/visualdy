      rel="stylesheet"
    />
    <script>
      // Gracefully silence HMR WebSocket errors in AI Studio iframe environment (HMR: Disabled)
      if (typeof window !== 'undefined') {
        window.addEventListener(
          'error',
          function (e) {
            if (e && (e.message?.includes('WebSocket') || e.filename?.includes('@vite/client'))) {
              e.preventDefault();
              e.stopImmediatePropagation?.();
            }
          },
          true,
        );
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var msg = e?.reason?.message || String(e?.reason || '');
            var stack = e?.reason?.stack || '';
            if (
              msg.includes('WebSocket') ||
              stack.includes('createWebSocketModuleRunnerTransport') ||
              stack.includes('@vite/client')
            ) {
              e.preventDefault();
              e.stopImmediatePropagation?.();
            }
          },
          true,
        );
        if (window.WebSocket) {
          var OriginalWS = window.WebSocket;
          window.WebSocket = function (url, protocols) {
            if (protocols === 'vite-hmr' || (typeof protocols === 'string' && protocols.indexOf('vite') !== -1)) {
              var listeners = {};
              var fake = {
                readyState: 1,
                OPEN: 1,
                CLOSED: 3,
                addEventListener: function (event, cb) {
                  if (!listeners[event]) listeners[event] = [];
                  listeners[event].push(cb);
                  if (event === 'open') setTimeout(cb, 0);
                },
                removeEventListener: function (event, cb) {
                  if (!listeners[event]) return;
                  listeners[event] = listeners[event].filter(function (fn) {
                    return fn !== cb;
                  });
                },
                send: function () {},
                close: function () {
                  if (listeners['close']) {
                    listeners['close'].forEach(function (fn) {
                      fn({ code: 1000, reason: 'Normal Closure' });
                    });
                  }
                },
              };
              return fake;
            }
            return new OriginalWS(url, protocols);
          };
          window.WebSocket.prototype = OriginalWS.prototype;
          window.WebSocket.OPEN = OriginalWS.OPEN;
          window.WebSocket.CLOSED = OriginalWS.CLOSED;
          window.WebSocket.CONNECTING = OriginalWS.CONNECTING;
          window.WebSocket.CLOSING = OriginalWS.CLOSING;
        }
      }
    </script>
  </head>

  </body>
