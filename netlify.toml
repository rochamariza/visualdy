# Netlify Configuration for Visualdy (React + Vite SPA)

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Rota de proxy para a Netlify Function do Gemini (API Serverless)
[[redirects]]
  from = "/api/gemini"
  to = "/.netlify/functions/gemini"
  status = 200

# Regra SPA: Redireciona todas as rotas de navegação para index.html com status 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache de longa duração para assets com hash gerados pelo Vite
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers de segurança recomendados
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
